version: 1
metadata:
  name: Main Authentik Configuration - my-vm1-federated-app
  labels:
    blueprints.goauthentik.io/generated: 'false'
entries:
  - model: authentik_flows.flow
    identifiers:
      slug: app-auth-flow
    attrs:
      name: Application Authorization Flow
      title: Authorize Application
      designation: authorization
      authentication: none
      policy_engine_mode: any
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_flows.flow
    identifiers:
      slug: app-invalidation-flow
    attrs:
      name: Application Invalidation Flow
      title: Invalidate Session
      designation: invalidation
      authentication: none
      policy_engine_mode: any
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_flows.flow
    identifiers:
      slug: federated-jit-enrollment
    attrs:
      name: federated-jit-enrollment
      title: Federated JIT Enrollment
      designation: enrollment
      authentication: none
      policy_engine_mode: any
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_flows.flow
    identifiers:
      slug: enrollment-invitation
    attrs:
      name: enrollment-invitation
      title: Enrollment Invitation
      designation: enrollment
      authentication: none
      policy_engine_mode: any
      compatibility_mode: true
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_stages_redirect.redirectstage
    identifiers:
      name: redirect-logout-stage
    attrs:
      mode: static
      target_static: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/callback/logout
      keep_context: true
    state: present
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: create-jit-user
    attrs:
      create_users_as_inactive: false
      create_users_group:
      user_creation_mode: create_when_required
      user_path_template: ''
      user_type: internal
    state: present
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: enrollment-invitation-write
    attrs:
      create_users_as_inactive: false
      create_users_group:
      user_creation_mode: create_when_required
      user_path_template: ''
      user_type: internal
    state: present
  - model: authentik_stages_invitation.invitationstage
    identifiers:
      name: enrollment-invitation
    attrs:
      continue_flow_without_invitation: false
    state: present
  - model: authentik_stages_deny.denystage
    identifiers:
      name: user-email-check-deny
    attrs:
      deny_message: Email already exists! Contact admin.
    state: present
  - model: authentik_stages_deny.denystage
    identifiers:
      name: user-username-check-deny
    attrs:
      deny_message: Username already exists! Try another one.
    state: present
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: default-source-enrollment-prompt
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, default-source-enrollment-field-username]]
        - !Find [authentik_stages_prompt.prompt, [name, default-user-settings-field-name]]
        - !Find [authentik_stages_prompt.prompt, [name, initial-setup-field-password]]
        - !Find [authentik_stages_prompt.prompt, [name, initial-setup-field-password-repeat]]
      validation_policies: []
    state: present
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: orgId
    attrs:
      field_key: orgId
      label: Organization ID
      type: dropdown
      required: true
      placeholder: "return [\n    {\"label\": \"ocean_enterprise\", \"value\": \"\
        ocean_enterprise\"},\n    {\"label\": \"delta_dao\", \"value\": \"delta_dao\"\
        },\n    {\"label\": \"other_org\", \"value\": \"other_org\"},\n]"
      placeholder_expression: true
      initial_value: ''
      initial_value_expression: false
      order: 100
    state: present
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    identifiers:
      name: federated-oidc-mapping
    attrs:
      name: federated-oidc-mapping
      expression: "return {\n    \"username\": info.get(\"preferred_username\") or
        info.get(\"nickname\") or info.get(\"sub\"),\n    \"email\": info.get(\"email\"\
        ),\n    \"name\": info.get(\"name\") or info.get(\"given_name\") or \"Federated
        User\",\n\n    \"attributes\": {\n        \"upstream_idp\": source.name if
        source else \"unknown1\",\n        \"orgId\": info.get(\"orgId\", \"unknown1\"\
        ),\n        \"walletId\": info.get(\"walletId\", \"unknown1\"),\n        \"\
        signerServer\": info.get(\"signerServer\", \"unknown1\"),\n        \"external_subject\"\
        : info.get(\"sub\"),\n        \"idp_issuer\": info.get(\"iss\"),\n    },\n\
        \n    \"orgId\": info.get(\"orgId\", \"unknown7\"),\n    \"walletId\": info.get(\"\
        walletId\", \"unknown7\"),\n    \"signerServer\": info.get(\"signerServer\"\
        , \"unknown7\"),\n    \"upstream_idp\": source.name if source else \"unknown7\"\
        ,\n    \"external_subject\": info.get(\"sub\"),\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: organizationId
    attrs:
      scope_name: organizationId
      description: used to gain organization Id claim
      expression: "return {\n    \"orgId\": request.user.attributes.get(\"orgId\"\
        , \"\")\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: signerServer
    attrs:
      scope_name: signerServer
      description: Used to claim signer server url
      expression: "return {\n    \"signerServer\": request.user.attributes.get(\"\
        signerServer\", \"\")\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: walletId
    attrs:
      scope_name: walletId
      description: Used to claim wallet id
      expression: "return {\n    \"walletId\": request.user.attributes.get(\"walletId\"\
        , \"\")\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: federated_identity
    attrs:
      scope_name: federated_identity
      description: Federated identity information
      expression: "return {\n    \"upstream_idp\": request.user.attributes.get(\"\
        upstream_idp\", \"unknown3\")\n}"
    state: present
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: save-user-attributes
    attrs:
      execution_logging: true
      expression: "org = context.get(\"prompt_data\", {}).get(\"orgId\")\nwallet_id
        = context.get(\"prompt_data\", {}).get(\"walletId\")\nsigner_server = context.get(\"\
        prompt_data\", {}).get(\"signerServer\")\n\nuser = context.get(\"pending_user\"\
        )\n\nif user:\n    if org:\n        user.attributes[\"orgId\"] = org\n   \
        \ \n    if wallet_id:\n        user.attributes[\"walletId\"] = wallet_id\n\
        \    \n    if signer_server:\n        user.attributes[\"signerServer\"] =
        signer_server\n    \n    user.save()\n\nreturn True"
    state: present
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: check-email-exist-policy
    attrs:
      execution_logging: true
      expression: "from authentik.core.models import User\nfrom django.core.mail import
        send_mail\nfrom django.conf import settings\n\nemail = request.context.get(\"\
        prompt_data\", {}).get(\"email\")\n\nif not email:\n    return False\n\nexists
        = User.objects.filter(email__iexact=email).exists()\n\nif exists:\n    send_mail(\n\
        \        subject=\"Invitation attempted for existing user\",\n        message=(\n\
        \            f\"An invitation was created for '{email}', \"\n            \"\
        but a user with this email already exists.\"\n        ),\n        from_email=settings.DEFAULT_FROM_EMAIL,\n\
        \        recipient_list=[\"ahmedrazach118@gmail.com\"],\n        fail_silently=False,\n\
        \    )\n\nreturn exists"
    state: present
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: check-username-exist-policy
    attrs:
      execution_logging: true
      expression: "from authentik.core.models import User\n\nusername = request.context.get(\"\
        prompt_data\", {}).get(\"username\")\n\nif not username:\n    return False\n\
        \nexists = User.objects.filter(username__iexact=username).exists()\n\nreturn
        exists"
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !Find [authentik_stages_user_write.userwritestage, [name, create-jit-user]]
      target: !Find [authentik_flows.flow, [slug, federated-jit-enrollment]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      target: !Find [authentik_flows.flow, [slug, federated-jit-enrollment]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !Find [authentik_stages_invitation.invitationstage, [name, enrollment-invitation]]
      target: !Find [authentik_flows.flow, [slug, enrollment-invitation]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    id: email-check-binding
    identifiers:
      order: 15
      stage: !Find [authentik_stages_deny.denystage, [name, user-email-check-deny]]
      target: !Find [authentik_flows.flow, [slug, enrollment-invitation]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-source-enrollment-prompt]]
      target: !Find [authentik_flows.flow, [slug, enrollment-invitation]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    id: username-check-binding
    identifiers:
      order: 25
      stage: !Find [authentik_stages_deny.denystage, [name, user-username-check-deny]]
      target: !Find [authentik_flows.flow, [slug, enrollment-invitation]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 30
      stage: !Find [authentik_stages_user_write.userwritestage, [name, enrollment-invitation-write]]
      target: !Find [authentik_flows.flow, [slug, enrollment-invitation]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    id: redirect-binding
    identifiers:
      order: 40
      stage: !Find [authentik_stages_redirect.redirectstage, [name, redirect-logout-stage]]
      target: !Find [authentik_flows.flow, [slug, enrollment-invitation]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      policy: !Find [authentik_policies_expression.expressionpolicy, [name,
        save-user-attributes]]
      target: !KeyOf redirect-binding
    attrs:
      enabled: true
      failure_result: false
      group:
      negate: false
      timeout: 30
      user:
    state: present
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      policy: !Find [authentik_policies_expression.expressionpolicy, [name,
        check-email-exist-policy]]
      target: !KeyOf email-check-binding
    attrs:
      enabled: true
      failure_result: false
      group:
      negate: false
      timeout: 30
      user:
    state: present
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      policy: !Find [authentik_policies_expression.expressionpolicy, [name,
        check-username-exist-policy]]
      target: !KeyOf username-check-binding
    attrs:
      enabled: true
      failure_result: false
      group:
      negate: false
      timeout: 30
      user:
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      target: !Find [authentik_flows.flow, [slug, app-invalidation-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !Find [authentik_stages_redirect.redirectstage, [name, redirect-logout-stage]]
      target: !Find [authentik_flows.flow, [slug, app-invalidation-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: vm1-federated-provider
    attrs:
      name: vm1-federated-provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, app-invalidation-flow]]
      client_id: oyo2i1mcyb1qazx6i18xyejkvz36q2zy
      client_secret: 8KDQV-bF9vFsXQhoGQid_UWJoZ27D9dniBSiBYyvObN
      client_type: confidential
      grant_types:
        - authorization_code
        - implicit
        - hybrid
        - refresh_token
        - client_credentials
        - password
        - urn:ietf:params:oauth:grant-type:device_code
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      refresh_token_threshold: hours=1
      include_claims_in_id_token: true
      issuer_mode: per_provider
      logout_method: backchannel
      logout_uri: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/callback/logout
      backchannel_logout_enabled: true
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, organizationId]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, signerServer]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, walletId]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, federated_identity]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://ocean-node-vm2.oceanenterprise.io:8443/source/oauth/callback/vm1-partner-source/
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/login
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/callback/logout
    state: present
  - model: authentik_core.application
    identifiers:
      slug: vm1-federated-app
    attrs:
      name: my-vm1-federated-app
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, vm1-federated-provider]]
      policy_engine_mode: any
      meta_description: ''
      meta_icon: ''
      meta_launch_url: ''
      open_in_new_tab: false
    state: present

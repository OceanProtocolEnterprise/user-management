version: 1
metadata:
  name: Main Authentik Configuration - main-oidc-app
  labels:
    blueprints.goauthentik.io/generated: 'false'
entries:
  - model: authentik_flows.flow
    identifiers:
      slug: app-auth-flow
    attrs:
      name: Application Authorization Flow
      title: Authorize Application
      designation: authorization
      authentication: none
      policy_engine_mode: any
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_flows.flow
    identifiers:
      slug: app-invalidation-flow
    attrs:
      name: Application Invalidation Flow
      title: Invalidate Session
      designation: invalidation
      authentication: none
      policy_engine_mode: any
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_flows.flow
    identifiers:
      slug: recovery-flow
    attrs:
      name: recovery-flow
      title: Recovery Flow
      designation: recovery
      authentication: none
      policy_engine_mode: any
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_flows.flow
    identifiers:
      slug: federated-jit-enrollment
    attrs:
      name: federated-jit-enrollment
      title: Federated JIT Enrollment
      designation: enrollment
      authentication: none
      policy_engine_mode: any
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
    state: present
  - model: authentik_stages_redirect.redirectstage
    identifiers:
      name: redirect-logout-stage
    attrs:
      mode: static
      target_static: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/login
      keep_context: true
    state: present
  - model: authentik_stages_email.emailstage
    identifiers:
      name: recovery-email
    attrs:
      name: recovery-email
      activate_user_on_success: false
      host: smtp.gmail.com
      port: 587
      username: your-email@gmail.com
      password: your-app-password
      use_tls: true
      use_ssl: false
      timeout: 30
      from_address: noreply@authentik.local
      subject: Recovery Email
      template: email/recovery.html
    state: present
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: create-jit-user
    attrs:
      create_users_as_inactive: false
      create_users_group:
      user_creation_mode: create_when_required
      user_path_template: ''
      user_type: internal
    state: present
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: orgId
    attrs:
      field_key: orgId
      label: Organization ID
      type: dropdown
      required: true
      placeholder: "return [\n    {\"label\": \"ocean_enterprise\", \"value\": \"\
        ocean_enterprise\"},\n    {\"label\": \"delta_dao\", \"value\": \"delta_dao\"\
        },\n    {\"label\": \"other_org\", \"value\": \"other_org\"},\n]"
      placeholder_expression: true
      initial_value: ''
      initial_value_expression: false
      order: 100
    state: present
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: recovery-authentication-identification
    attrs:
      name: recovery-authentication-identification
      user_fields:
        - email
      pretend_user_exists: true
      sources: []
      show_source_labels: false
      enable_remember_me: false
      case_insensitive_matching: true
    state: present
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: default-password-change-prompt
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password]]
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password-repeat]]
      validation_policies:
        - !Find [authentik_policies_password.passwordpolicy, [name, default-password-change-password-policy]]
    state: present
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    identifiers:
      name: federated-oidc-mapping
    attrs:
      name: federated-oidc-mapping
      expression: "return {\n    \"username\": info.get(\"preferred_username\") or
        info.get(\"nickname\") or info.get(\"sub\"),\n    \"email\": info.get(\"email\"\
        ),\n    \"name\": info.get(\"name\") or info.get(\"given_name\") or \"Federated
        User\",\n\n    \"attributes\": {\n        \"upstream_idp\": source.name if
        source else \"unknown1\",\n        \"orgId\": info.get(\"orgId\", \"unknown1\"\
        ),\n        \"walletId\": info.get(\"walletId\", \"unknown1\"),\n        \"\
        signerServer\": info.get(\"signerServer\", \"unknown1\"),\n        \"external_subject\"\
        : info.get(\"sub\"),\n        \"idp_issuer\": info.get(\"iss\"),\n    },\n\
        \n    \"orgId\": info.get(\"orgId\", \"unknown7\"),\n    \"walletId\": info.get(\"\
        walletId\", \"unknown7\"),\n    \"signerServer\": info.get(\"signerServer\"\
        , \"unknown7\"),\n    \"upstream_idp\": source.name if source else \"unknown7\"\
        ,\n    \"external_subject\": info.get(\"sub\"),\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: organizationId
    attrs:
      scope_name: organizationId
      description: used to gain organization Id claim
      expression: "return {\n    \"orgId\": request.user.attributes.get(\"orgId\"\
        , \"\")\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: signerServer
    attrs:
      scope_name: signerServer
      description: Used to claim signer server url
      expression: "return {\n    \"signerServer\": request.user.attributes.get(\"\
        signerServer\", \"\")\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: walletId
    attrs:
      scope_name: walletId
      description: Used to claim wallet id
      expression: "return {\n    \"walletId\": request.user.attributes.get(\"walletId\"\
        , \"\")\n}"
    state: present
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: federated_identity
    attrs:
      scope_name: federated_identity
      description: Federated identity information
      expression: "return {\n    \"upstream_idp\": request.user.attributes.get(\"\
        upstream_idp\", \"unknown3\")\n}"
    state: present
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: save-user-attributes
    attrs:
      execution_logging: true
      expression: "org = context.get(\"prompt_data\", {}).get(\"orgId\")\nwallet_id
        = context.get(\"prompt_data\", {}).get(\"walletId\")\nsigner_server = context.get(\"\
        prompt_data\", {}).get(\"signerServer\")\n\nuser = context.get(\"pending_user\"\
        )\n\nif user:\n    if org:\n        user.attributes[\"orgId\"] = org\n   \
        \ \n    if wallet_id:\n        user.attributes[\"walletId\"] = wallet_id\n\
        \    \n    if signer_server:\n        user.attributes[\"signerServer\"] =
        signer_server\n    \n    user.save()\n\nreturn True"
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !Find [authentik_stages_identification.identificationstage, [name,
        recovery-authentication-identification]]
      target: !Find [authentik_flows.flow, [slug, recovery-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !Find [authentik_stages_email.emailstage, [name, recovery-email]]
      target: !Find [authentik_flows.flow, [slug, recovery-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 30
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
      target: !Find [authentik_flows.flow, [slug, recovery-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 40
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      target: !Find [authentik_flows.flow, [slug, recovery-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !Find [authentik_stages_user_write.userwritestage, [name, create-jit-user]]
      target: !Find [authentik_flows.flow, [slug, federated-jit-enrollment]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      target: !Find [authentik_flows.flow, [slug, federated-jit-enrollment]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      target: !Find [authentik_flows.flow, [slug, app-invalidation-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !Find [authentik_stages_redirect.redirectstage, [name, redirect-logout-stage]]
      target: !Find [authentik_flows.flow, [slug, app-invalidation-flow]]
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
    state: present
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: main-oidc-provider
    attrs:
      name: main-oidc-provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, app-invalidation-flow]]
      client_id: c105tyuum12g0ypuuoxupnrlamckwlov
      client_secret: GBkOn1vaNGAEJKwmH0Ddr_A4eNIbyLo8VVIiw6HAfLI
      client_type: confidential
      grant_types:
        - authorization_code
        - implicit
        - hybrid
        - refresh_token
        - client_credentials
        - password
        - urn:ietf:params:oauth:grant-type:device_code
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      refresh_token_threshold: hours=1
      include_claims_in_id_token: true
      issuer_mode: per_provider
      logout_method: backchannel
      logout_uri: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/login
      backchannel_logout_enabled: true
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, organizationId]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, signerServer]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, walletId]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, federated_identity]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/callback
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://market-git-feat-stage-ocean-enterprise.vercel.app/auth/login
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://app.dfns.io/sso
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://app.dfns.io/login
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://market-git-feat-stage-ocean-enterprise.vercel.app/api/dfns/complete-sso
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://wallet-dev-stage.oceanenterprise.io/api/dfns/complete-sso
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://wallet-dev-stage.oceanenterprise.io/auth/login
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://wallet-dev-stage.oceanenterprise.io/auth/callback
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://wallet-dev-stage.oceanenterprise.io
    state: present
  - model: authentik_core.application
    identifiers:
      slug: main-oidc-app
    attrs:
      name: main-oidc-app
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, main-oidc-provider]]
      policy_engine_mode: any
      meta_description: ''
      meta_icon: ''
      meta_launch_url: ''
      open_in_new_tab: false
    state: present
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      recovery_flow: !Find [authentik_flows.flow, [slug, recovery-flow]]
    state: present

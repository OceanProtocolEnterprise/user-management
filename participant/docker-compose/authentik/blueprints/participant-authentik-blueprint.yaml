  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: oe-save-user-attributes
    attrs:
      execution_logging: true
      expression: "org = context.get(\"prompt_data\", {}).get(\"orgId\")\nwallet_id
        = context.get(\"prompt_data\", {}).get(\"walletId\")\nsigner_server = context.get(\"\
        prompt_data\", {}).get(\"signerServer\")\nwell_known_url = context.get(\"\
        prompt_data\", {}).get(\"wellKnownUrl\")\n\nuser = context.get(\"pending_user\"\
        )\n\nif user:\n    if org:\n        user.attributes[\"orgId\"] = org\n   \
        \ \n    if wallet_id:\n        user.attributes[\"walletId\"] = wallet_id\n\
        \    \n    if signer_server:\n        user.attributes[\"signerServer\"] =
        signer_server\n    \n    if well_known_url:\n        user.attributes[\"wellKnownUrl\"\
        ] = well_known_url\n    \n    user.save()\n\nreturn True"
    state: present
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: oe-check-email-exist-policy
    attrs:
      execution_logging: true
      expression: "from authentik.core.models import User\nfrom django.core.mail import
        send_mail\nfrom django.conf import settings\n\nemail = request.context.get(\"\
        prompt_data\", {}).get(\"email\")\n\nif not email:\n    return False\n\nexists
        = User.objects.filter(email__iexact=email).exists()\n\nif exists:\n    send_mail(\n\
        \        subject=\"Invitation attempted for existing user\",\n        message=(\n\
        \            f\"An invitation was created for '{email}', \"\n            \"\
        but a user with this email already exists.\"\n        ),\n        from_email=settings.DEFAULT_FROM_EMAIL,\n\
        \        recipient_list=[\"support@oceanenterprise.io\"],\n        fail_silently=False,\n\
        \    )\n\nreturn exists"
    state: present
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: oe-check-username-exist-policy
    attrs:
      execution_logging: true
      expression: "from authentik.core.models import User\n\nusername = request.context.get(\"\
        prompt_data\", {}).get(\"username\")\n\nif not username:\n    return False\n\
        \nexists = User.objects.filter(username__iexact=username).exists()\n\nreturn
        exists"
    state: present

services:
  wallet-api:
    image: waltid/wallet-api:${WALLET_API_TAG:?}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    env_file:
      - .env
    extra_hosts:
      - "$SERVICE_HOST:host-gateway"
      - "waltid.enterprise.localhost:host-gateway"
    volumes:
      - ./wallet-api/config:/waltid-wallet-api/config
      - ./wallet-api/data:/waltid-wallet-api/data

  waltid-dev-wallet:
    image: oceanenterprise/waltid-dev-wallet:${DEV_WALLET_TAG:?}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      - wallet-api
      - caddy
    environment:
      NUXT_PUBLIC_ISSUER_CALLBACK_URL: "http://$SERVICE_HOST:$DEV_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_DEV_WALLET_URL: "http://$SERVICE_HOST:$DEV_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_DEMO_WALLET_URL: "http://$SERVICE_HOST:$DEMO_WALLET_FRONTEND_PORT"
      PORT: $DEV_WALLET_FRONTEND_PORT
      DFNS_ORG_ID: $DFNS_ORG_ID
      DFNS_BASE_URL: $DFNS_BASE_URL
      DFNS_RP_ID: $DFNS_RP_ID

  postgres:
    image: postgres:${POSTGRES_TAG:-18}
    container_name: postgres
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-U", "$DB_USERNAME" ]
      interval: 5s
      timeout: 1s
      retries: 5
    environment:
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USERNAME
      POSTGRES_PASSWORD: $DB_PASSWORD
      AUTHENTIK_PG_DB: $AUTHENTIK_PG_DB
      AUTHENTIK_PG_USER: $AUTHENTIK_PG_USER
      AUTHENTIK_PG_PASS: $AUTHENTIK_PG_PASS
    volumes:
      - wallet-api-db:/var/lib/postgresql
      - ./postgres-init/create-authentik-db.sh:/docker-entrypoint-initdb.d/10-create-authentik-db.sh:ro

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:?}
    container_name: authentik-server
    command: server
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: $AUTHENTIK_PG_DB
      AUTHENTIK_POSTGRESQL__USER: $AUTHENTIK_PG_USER
      AUTHENTIK_POSTGRESQL__PASSWORD: $AUTHENTIK_PG_PASS
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    ports:
      - "${AUTHENTIK_PORT_HTTP:-9000}:9000"
      - "${AUTHENTIK_PORT_HTTPS:-9443}:9443"
    volumes:
      - ./authentik/data:/data
      - ./authentik/custom-templates:/templates
      - ./authentik/blueprints:/blueprints/custom:ro

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:?}
    container_name: authentik-worker
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: $AUTHENTIK_PG_DB
      AUTHENTIK_POSTGRESQL__USER: $AUTHENTIK_PG_USER
      AUTHENTIK_POSTGRESQL__PASSWORD: $AUTHENTIK_PG_PASS
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authentik/data:/data
      - ./authentik/certs:/certs
      - ./authentik/custom-templates:/templates
      - ./authentik/blueprints:/blueprints/custom:ro

  openbao:
    build:
      context: ./openbao
      dockerfile: Dockerfile
    container_name: openbao
    restart: unless-stopped
    ports:
      - "${OPENBAO_PORT:-8200}:8200"
    environment:
      PRIVATE_KEYS_FILE: /run/secrets/private_keys
      PERSISTENT_PRIVATE_KEYS_FILE: /run/secrets/private_keys
      # To use your own TLS certificate instead of the auto-generated self-signed one,
      # uncomment and set these to the paths of your cert and key files inside the container.
      # TLS_CERT_SOURCE: /path/to/tls.crt
      # TLS_KEY_SOURCE: /path/to/tls.key
    volumes:
      - openbao-data:/bao/data
      - openbao-keys:/vault/keys
      - openbao-tls:/etc/openbao/tls
      - ./secrets/private_keys:/run/secrets/private_keys
    healthcheck:
      # Uses -tls-skip-verify because the cert is self-signed by default.
      # If you supply a trusted CA cert, remove that flag.
      test: ["CMD", "bao", "status", "-tls-skip-verify"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  signer-server:
    image: oceanenterprise/signer-server:${SIGNER_SERVER_TAG:?}
    pull_policy: missing
    container_name: signer-server
    restart: unless-stopped
    depends_on:
      openbao:
        condition: service_healthy
    ports:
      - "${SIGNER_SERVER_PORT:-3001}:3001"
    environment:
      SIGNER_MODE: ${SIGNER_MODE:-vault}
      VAULT_URL: ${VAULT_URL:-https://openbao:8200}
      VAULT_ETHEREUM_MOUNT: ${VAULT_ETHEREUM_MOUNT:-ethereum}
      VAULT_KV_STORE_PATH: ${VAULT_KV_STORE_PATH:-secret}
      VAULT_TIMEOUT_MS: ${VAULT_TIMEOUT_MS:-10000}
      NODE_EXTRA_CA_CERTS: /etc/openbao/tls/tls.crt
      PORT: 3001
      NODE_ENV: production
      NODE_URI_MAP: ${NODE_URI_MAP:?}
      AUTHENTIK_JWKS_URI: ${AUTHENTIK_JWKS_URI:?}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:?}
      AUTHENTIK_AUDIENCE: ${AUTHENTIK_AUDIENCE:?}
      API_KEY_FALLBACK: ${API_KEY_FALLBACK:?}
    volumes:
      - openbao-tls:/etc/openbao/tls:ro
      - openbao-keys:/vault/keys:ro
    command:
      - sh
      - -c
      - |
        echo "[signer-server] waiting for OpenBao TLS certificate..."
        until [ -s /etc/openbao/tls/tls.crt ]; do
          sleep 2
        done
        echo "[signer-server] waiting for OpenBao root token..."
        until [ -s /vault/keys/root_token ]; do
          sleep 2
        done
        export VAULT_TOKEN="$$(cat /vault/keys/root_token)"
        export NODE_EXTRA_CA_CERTS=/etc/openbao/tls/tls.crt
        echo "[signer-server] starting with VAULT_URL=$$VAULT_URL"
        exec node dist/main.js

  caddy:
    image: docker.io/caddy:${CADDY_TAG:-2}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - target: $WALLET_BACKEND_PORT
        published: $WALLET_BACKEND_PORT      # wallet-api (7001)
        protocol: tcp
        mode: host
      - target: $DEV_WALLET_FRONTEND_PORT
        published: $DEV_WALLET_FRONTEND_PORT # waltid-dev-wallet (7104)
        protocol: tcp
        mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  wallet-api-db:
  openbao-data:
  openbao-keys:
  openbao-tls:
